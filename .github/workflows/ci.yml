name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      # coverage of a file merges only if it has the same content
      - name: Keep LF Line Endings
        if: matrix.platform.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      # the coverage job checks the merged coverage of all systems
      - name: Run Tests
        run: npm test
        env:
          UBQ_COVERAGE_CHECK: 'off'

      - name: Save Coverage
        uses: actions/upload-artifact@v7
        with:
          name: store-${{ matrix.platform.os }}-${{ matrix.platform.shell }}-${{ matrix.node-version }}
          path: .ubq/runs.db*
          include-hidden-files: true

  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Nodejs 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Install dependencies
        run: npm install

      - name: Get Coverage of Each System
        uses: actions/download-artifact@v8
        with:
          pattern: store-*
          path: stores

      - name: Merge Coverage
        run: npx ubq merge stores/*

      - name: Check Coverage
        run: npx ubq uncovered
